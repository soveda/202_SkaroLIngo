draft: true
Name: SkaroLIngo
short-description: MF-102-inspired voice ring modulator for the Workshop Computer.
summary: |
  Card 202: an MF-102-inspired voice ring modulator with a SkaroLIngo voice
  character. Audio In 1 is the programme input and Audio In 2 can replace the
  internal carrier; otherwise the internal carrier does the classic ring-mod
  job. Switch Middle is the performance page with carrier frequency, dry/ring
  mix, and drive. Switch Up edits the LFO rate, LFO depth, and
  analogue-saturation-to-digital ring character. Tapping Switch Down cycles three voice
  characters: Skaro, Mondas, and Hybrid.
Language: C++ (Pico SDK)
Creator: Adrian Vos
Version: "0.1.0-alpha"
Status: Alpha - generated scaffold, not yet hardware-tested
License: MIT
date-created: 2026-09-06
date-updated: 2026-09-06
Repository: ../202_SkaroLIngo
contact: {}

